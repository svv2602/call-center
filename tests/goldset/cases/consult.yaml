# Tyre and wheel consultation (owner decisions 2026-09-28): 2–3 variants,
# brand priority Bridgestone → Firestone → Laufenn, no studded in size →
# studless with a caveat, a non-stock size is not offered, wheels are sold
# and consulted in both networks. Real wording from prod is marked prod:<id>.

- id: tyres_two_or_three_variants_by_priority
  title: 2–3 варіанти, першим Bridgestone
  source: owner:brand-priority
  network: both
  sales_enabled: true
  pending: 'wave-5-M-tire-consult-dialogue: the dialogue does not cap variants nor order by priority yet'
  mocks:
    search_tires:
      total: 5
      items:
        - {id: t1, brand: Michelin, model: Primacy 4+, size: 205/55 R16, season: summer, price: 3900, currency: UAH, in_stock: true}
        - {id: t2, brand: Nokian, model: Hakka Blue 3, size: 205/55 R16, season: summer, price: 3500, currency: UAH, in_stock: true}
        - {id: t3, brand: Bridgestone, model: Turanza 6, size: 205/55 R16, season: summer, price: 3700, currency: UAH, in_stock: true}
        - {id: t4, brand: Firestone, model: Roadhawk 2, size: 205/55 R16, season: summer, price: 3100, currency: UAH, in_stock: true}
        - {id: t5, brand: Laufenn, model: S Fit EQ+, size: 205/55 R16, season: summer, price: 2400, currency: UAH, in_stock: true}
  turns:
    - user: потрібні літні шини 205/55 R16
      expect:
        tool_called: [search_tires]
        must_contain: ['Bridgestone']
        must_not_contain: ['(?s)(?=.*michelin)(?=.*nokian)']
        max_sentences: 5

- id: studded_none_studless_with_caveat
  title: шипованих у розмірі немає — липучка із застереженням
  source: tshina:studded_none_fallback_ru
  network: both
  sales_enabled: true
  pending: 'wave-4-J-tire-search-filters-and-ladder: search_tires has no studded filter yet'
  mocks:
    search_tires:
      total: 1
      items:
        - {id: w1, brand: Bridgestone, model: Blizzak 6, size: 235/55 R19, season: winter, studded: false, price: 6900, currency: UAH, in_stock: true}
  turns:
    - user: потрібні шиповані 235/55 R19
      expect:
        must_contain: ['шипован\w*\s+(?:\w+\s+){0,5}(немає|нема|відсутн)', 'липучк|фрикційн|нешипован']
        must_not_contain: ['який сезон', 'какой сезон']

- id: non_stock_size_not_offered
  title: нештатний розмір бот не пропонує — «підбирає спеціаліст»
  source: tshina:size_change_compare_ru
  network: both
  sales_enabled: true
  pending: 'wave-5-M-tire-consult-dialogue: no non-stock-size rule in the dialogue yet'
  turns:
    - user: можна поставити 225/45 R17 замість 205/55 R16?
      expect:
        must_contain: ['спеціаліст|фахів|менеджер']
        must_not_contain: ['(можна|можете)\s+(?:\w+\s+){0,2}постав', 'підійде без проблем', 'так, підійде']
        tool_not_called: [search_tires]

- id: discount_no_links
  title: знижки — без посилань на сайт (голос)
  source: tshina:discount_question_ua
  network: both
  sales_enabled: true
  pending: 'wave-3-G-sales-scope-switch: promotions are answered only in the sales scope'
  turns:
    - user: які знижки на зимові шини зараз є?
      expect:
        must_not_contain: ['https?://', 'www\.', '\.com\.ua', 'на сайті']

- id: load_index_consult
  title: індекс навантаження — пояснити, не переводити (c6a75668)
  source: prod:c6a75668
  network: both
  sales_enabled: true
  pending: 'wave-3-H-kb-tshina-faq-and-wheels: the tyre reference articles are not in the knowledge base yet'
  turns:
    - user: Добрий день підкажіть будь ласка що таке індекс навантаження
      expect:
        must_contain: ['кілограм|кг|ваг|навантаж']
        tool_not_called: [transfer_to_operator]
        max_sentences: 4

- id: disks_sold_in_both
  title: диски продаємо в обох мережах — не «не продаємо»
  source: owner:disks-both-networks
  network: both
  sales_enabled: true
  pending: 'wave-3-G-sales-scope-switch: until the switch any wheel question is transferred'
  turns:
    - user: а диски у вас є?
      expect:
        must_not_contain: ['не продаєм', 'не продаем', 'тільки шини', 'только шины', 'не займаєм']

- id: disk_type_consult
  title: штамповка чи литі на зиму — консультація, не переведення
  source: tshina:disk_type_comparison_ru
  network: both
  sales_enabled: true
  pending: 'wave-3-H-kb-tshina-faq-and-wheels: the wheel articles are not in the knowledge base yet'
  turns:
    - user: що краще ставити на зиму — штамповку чи литі диски?
      expect:
        must_contain: ['штамп']
        tool_not_called: [transfer_to_operator]
