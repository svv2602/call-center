# Terms that differ by network (owner decisions 2026-09-28). Every case is
# `network: both` with separate expectations — the networks share one prompt,
# so one network's term leaking into the other is the defect these catch.
# `network_leak` runs on every turn by default on top of these.
#
# Precondition (wave 6-Q): the harness reads each network's real `tenants`
# row, so `config.network_policy` must be written for both networks (admin
# form, 1cd6c7c). Unwritten, `render_network_block` renders the default-deny
# block — no delivery terms, «Не надаємо: шиномонтаж, зберігання» even for
# Tvoya Shina — and these cases go red for the data, not the bot.
# The spoken-reply guard (network_claim_guard) runs only in the voice path;
# here the model's own answer is checked.

- id: delivery_cost_ua
  title: доставка — ТШ безкоштовно; ПК за тарифами перевізника, суму не називати
  source: tshina:delivery_cost_lviv_ua
  network: both
  sales_enabled: true
  turns:
    - user: скільки коштує доставка до Львова?
      expect:
        must_not_contain: ['якому місті', 'яке місто']
      expect_by_network:
        tvoya-shina:
          must_contain: ['безкоштовн']
        prokoleso:
          must_contain: ['тариф\w*\s+перевізник']
          must_not_contain: ['\d+\s*(грн|гривень|гривні)', 'безкоштовн']

- id: delivery_cost_ru
  title: доставка по-русски — те же условия сети
  source: tshina:delivery_cost_lviv_ru
  network: both
  sales_enabled: true
  turns:
    - user: сколько стоит доставка во Львов?
      expect_by_network:
        tvoya-shina:
          must_contain: ['безкоштовн']
        prokoleso:
          must_contain: ['тариф\w*\s+перевізник']
          must_not_contain: ['\d+\s*(грн|гривень|гривні)', 'безкоштовн']

- id: delivery_eta
  title: строк доставки — ТШ зазвичай 1–3 дні, точніше за ТТН; ПК приблизно 3 робочі дні
  source: tshina:delivery_eta_kyiv_ua
  notes: the term comes from network_policy.delivery_eta_text — ТШ the common «зазвичай 1–3 дні, точніше за ТТН», ПК the owner's «приблизно 3 робочі дні» (2026-10-27, R10, the carrier's own ETA is not used); unwritten, the bot must say «уточнить менеджер» and the case is red for the data
  network: both
  sales_enabled: true
  turns:
    - user: як швидко доставите шини у Київ?
      expect:
        must_not_contain: ['сьогодні ж', 'гарантовано завтра']
      expect_by_network:
        tvoya-shina:
          must_contain: ['(1|один|одного)\s*(-|–|—|до)\s*(3|три|трьох)|від одного до трьох']
        prokoleso:
          must_contain: ['(3|три|трьох)\s*робоч\w*\s*(дн|дн\w+)']
          must_not_contain: ['(1|один|одного)\s*(-|–|—|до)\s*(3|три|трьох)']

- id: delivery_tracking_ttn
  title: відстеження — номер замовлення чи телефон для статусу, або ТТН
  source: owner:delivery-terms
  notes: goldset O, group C — asking the order number or phone to look the status up (get_order_status) is as right as naming the ТТН (network_policy.delivery_eta_text — «зазвичай 1–3 дні, точніше за ТТН»); a transfer is not
  network: both
  sales_enabled: true
  turns:
    - user: а як я дізнаюсь де посилка?
      expect:
        must_contain: ['ТТН|накладн|номер\w*\s+(?:\w+\s+){0,2}(замовлен|заказ)|телефон']
        tool_not_called: [transfer_to_operator]

- id: pickup_both_networks
  title: самовивіз є в обох мережах
  source: owner:pickup
  network: both
  sales_enabled: true
  turns:
    - user: а можна забрати шини самому в Дніпрі?
      expect:
        tool_called: [get_pickup_points]
        must_not_contain: ['самовивозу немає', 'тільки доставк']

- id: extended_warranty_bridgestone
  title: розширена гарантія — тільки Bridgestone і тільки ТШ
  source: tshina:extended_warranty_only_bridgestone_ru
  network: both
  sales_enabled: true
  turns:
    - user: чи є розширена гарантія на шини Michelin?
      expect_by_network:
        tvoya-shina:
          must_contain: ['Bridgestone']
          must_not_contain: ['(є|діє)\s+(?:\w+\s+){0,2}розширен\w*\s+гаранті\w*\s+(?:\w+\s+){0,2}Michelin']
        prokoleso:
          must_not_contain: ['Bridgestone']

- id: warranty_return_same_terms
  title: гарантія і повернення — однакові в обох мережах
  source: tshina:warranty_return_ua
  network: both
  sales_enabled: true
  notes: the policy articles (1-B, ddc33eb) name no day counts — the terms are left to the manager; the case pins that the bot answers from them and invents no number
  mocks:
    search_knowledge_base:
      total: 2
      articles:
        - title: 'Гарантія на шини: загальні умови'
          category: warranty
          content: На всі шини діє гарантія виробника на заводський брак. Строк гарантії встановлює виробник, і він різний у різних брендів. Точний строк для конкретної шини уточнить менеджер. Гарантія не покриває механічні пошкодження, природний знос і пошкодження під час монтажу.
        - title: Умови повернення шин
          category: returns
          content: Товар належної якості можна повернути або обміняти у встановлений законом строк, якщо шини не були в експлуатації, без слідів монтажу, збережено товарний вигляд і маркування та є підтвердження покупки. Точний строк і порядок уточнить менеджер.
  turns:
    - user: яка гарантія на шини і чи можна їх повернути?
      expect:
        must_contain: ['гаранті', 'поверн|обмін|обмен|возврат']
        must_not_contain: ['\d+\s*(днів|дні|дней|дня|місяц|месяц|рок|год)']
        tool_not_called: [transfer_to_operator]

- id: pk_storage_not_provided
  title: ПК — зберігання «не надаємо», без згадки інших мереж
  source: owner:storage-and-fitting-tvoya-shina-only
  network: [prokoleso]
  sales_enabled: true
  turns:
    - user: у вас можна залишити шини на зберігання?
      expect:
        must_contain: ['не надаєм|не надаем|не пропонуєм']
        must_not_contain: ['інш\w*\s+мереж', 'партнер', 'друг\w*\s+сет']
        tool_not_called: [find_storage]

- id: pk_fitting_price_not_provided
  title: ПК — ціна монтажу — «не надаємо», без get_fitting_price
  source: owner:storage-and-fitting-tvoya-shina-only
  network: [prokoleso]
  sales_enabled: true
  turns:
    - user: скільки коштує шиномонтаж на шістнадцятий радіус?
      expect:
        must_contain: ['не надаєм|не надаем|не пропонуєм']
        tool_not_called: [get_fitting_price, get_fitting_stations]
