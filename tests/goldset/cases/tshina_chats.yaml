# --- comparison: two brands / models, «яка краща» ----------------------------

- id: tc_compare_bare_brands_in_size
  title: «що краще мішлен чи бридж?» — порівняння обох у розмірі розмови
  source: tshina:compare_bare_brands_in_size_ru
  network: both
  sales_enabled: true
  notes: «бридж» — the real chat word. TyreCompare hears it as Bridgestone (sound stem «бридж», wave 3-D), so the code says the label comparison first; the case checks both are compared and nothing is «not found»
  mocks:
    search_tires:
      total: 3
      items:
        - {id: w1, brand: Michelin, model: Alpin 7, size: 235/55 R19 105H XL, season: winter, price: 7480, in_stock: true, eu_label: {fuel: C, wet: B, noise_db: 70}}
        - {id: w2, brand: Bridgestone, model: Blizzak 6, size: 235/55 R19 105H XL, season: winter, price: 5899, in_stock: true, eu_label: {fuel: C, wet: B, noise_db: 72}}
        - {id: w3, brand: Firestone, model: WinterHawk 4, size: 235/55 R19 105H XL, season: winter, price: 4920, in_stock: true, eu_label: {fuel: C, wet: C, noise_db: 71}}
  turns:
    - user: зимові шини 235/55 R19, без шипів, бренд будь-який
      expect:
        tool_called: [search_tires]
    - user: що краще мішлен чи бридж?
      expect:
        must_contain: ['Michelin|Alpin|Мішлен|Мишлен', 'Bridgestone|Blizzak|Бріджстоун|Близак']
        must_not_contain: ['не вдалося знайти', 'не удалось найти', 'уточніть назв', 'уточните назв', 'немає даних для порівнян']
        tool_not_called: [transfer_to_operator]

