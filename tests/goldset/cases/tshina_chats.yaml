- id: tc_advise_after_compare_tests
  title: «Альпін 7 чи Близак 6?» → «що б ви порадили?» — рядок тестів, місце чесно
  source: tshina:dialog_advise_after_compare_ru
  network: both
  sales_enabled: true
  notes: b57db821d — under the comparison tshina names the model's place in the latest test, the awkward place too (owner 09-29). The `tests` shape is D's {source, year, place, of, size}
  mocks:
    search_tires:
      total: 2
      items:
        - id: w1
          brand: Michelin
          model: Alpin 7
          size: 235/55 R19 105H XL
          season: winter
          price: 7480
          in_stock: true
          eu_label: {fuel: C, wet: B, noise_db: 70}
          tests: [{source: Auto Bild, year: 2025, place: 3, of: 12, size: 235/55 R19}]
        - id: w2
          brand: Bridgestone
          model: Blizzak 6
          size: 235/55 R19 105H XL
          season: winter
          price: 5899
          in_stock: true
          eu_label: {fuel: C, wet: B, noise_db: 72}
          tests: [{source: ADAC, year: 2024, place: 9, of: 12, size: 225/55 R19}]
  turns:
    - user: зимові шини 235/55 R19, без шипів, бренд будь-який
    - user: що краще мішлен альпін сім чи близак шість?
      expect:
        must_contain: ['Auto Bild[^.]{0,40}\b3\b[^.]{0,20}\b12\b', 'ADAC[^.]{0,40}\b9\b[^.]{0,20}\b12\b']
        tool_not_called: [transfer_to_operator]
    - user: що б ви мені порадили?
      expect:
        must_contain: ['Alpin|Альпін|Blizzak|Близак']
        must_not_contain: ['(?<!не )(перш|перв)\w+ місц\w*\s+(?:\w+\s+){0,3}(Blizzak|Близак)', 'прямих замір\w* немає']
        tool_not_called: [transfer_to_operator]

