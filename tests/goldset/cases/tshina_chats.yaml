# Cases from the tshina web consultant's live chats (2026-09-27 … 10-26):
# the customer lines on which tshina found and fixed a consultant defect,
# in the part that applies to the voice bot — selection, «найдешевша»,
# novelty, comparing two brands / models, «яка краща / що порадите»
# (tyre tests), needs («тихі / на мокрій / економні / траса»), studs /
# friction / studdable, XL, load index, quantity («а якщо дві?»).
# Collected 2026-10-26 (checklist wave-1-C-goldset-tshina-chats, R05).
#
# Sources (`source: tshina:<fixture or test>:<case>`):
# - Tests/Fixtures/consultant-goldset/<id>.json — the fixture id;
# - Tests/Unit/Dialog/CallCenterChats20261020Test.php,
#   LiveSimulation20261019Test.php — the data-provider key / the line;
# - a tshina commit hash where the line is quoted in the commit message.
# Lines are Ukrainian; a Russian source line stays Russian where the case is
# about understanding it (the bot answers in Ukrainian anyway). Web-only
# wording (buttons, links, cards, «покажи») is dropped or re-said by voice.
#
# The sandbox plays the text path: the season guard and the spoken query
# parser do not run, so a line that should search names the season and
# «бренд будь-який» itself — otherwise the sales script asks them first (the
# same as consult.yaml).
#
# Mocks follow the live `search_tires` result: {id, brand, model, size,
# season, price, in_stock} + `runflat`, `eu_label {fuel, wet, noise_db}`.
# Fields of wave-2-A (`studded`, `xl`, `load_index`, `speed_index`) reach the
# LLM under sales; `tests` (wave-3-D) never reach it — the code says them
# (`tyre_compare`). Prices differ, so «найдешевша» is checkable.
#
# The waves the cases waited for have landed (wave 5-J took `pending` off):
# - wave-1-B / 3-E `tire_claim_guard` — a false «найдешевша», an invented
#   «новинка», a rating without data, a wrong EU class / stud type about a
#   named shown tyre are replaced by code;
# - wave-2-A — the LLM sees studded / xl / load_index / speed_index;
# - wave-3-D `tyre_compare` — «яка краща / що порадите / X чи Y» adds one
#   tyre-test line per model (≤2 tests);
# - wave-4-F `StoreClient._rank_tires` — a named need orders the result. The
#   search is mocked, so the ranking itself does not run here: each needs mock
#   IS the order `_rank_tires` gives by `tire_needs` tiers (unit-tested there).

# --- price: «найдешевша», «дешевше» -----------------------------------------

- id: tc_cheapest_of_shown
  title: «яка з них найдешевша?» — та, що найдешевша в результаті
  source: tshina:bef4f5d66
  network: both
  sales_enabled: true
  mocks:
    search_tires:
      total: 3
      items:
        - {id: s1, brand: Bridgestone, model: Turanza 6, size: 205/55 R16 91V, season: summer, price: 3700, in_stock: true, eu_label: {fuel: C, wet: A, noise_db: 71}}
        - {id: s2, brand: Firestone, model: Roadhawk 2, size: 205/55 R16 91V, season: summer, price: 3100, in_stock: true, eu_label: {fuel: B, wet: A, noise_db: 70}}
        - {id: s3, brand: Laufenn, model: S Fit EQ+, size: 205/55 R16 91V, season: summer, price: 2400, in_stock: true, eu_label: {fuel: C, wet: B, noise_db: 72}}
  turns:
    - user: літні 205/55 R16, бренд будь-який
      expect:
        tool_called: [search_tires]
    - user: а яка з них найдешевша?
      expect:
        must_contain: ['Laufenn|Лауфен', '2\s?400|дві тисячі чотириста']
        must_not_contain: ['(Bridgestone|Firestone|Turanza|Roadhawk)\W+(?:\w+\W+){0,4}(найдешевш|найдоступніш|самая дешев|самая доступн)']
        tool_not_called: [transfer_to_operator]

- id: tc_cheaper_no_implied_budget
  title: «а дешевше є?» — без вигаданого «вашого бюджету»
  source: tshina:cheaper_no_implied_budget_ru
  network: both
  sales_enabled: true
  notes: the client never named a budget; tshina cut «в рамках вашего бюджета». Our budget_note (tool_result_compressor) covers it (R12) — the case pins it
  mocks:
    search_tires:
      total: 3
      items:
        - {id: s1, brand: Bridgestone, model: Turanza 6, size: 205/55 R16 91V, season: summer, price: 3700, in_stock: true}
        - {id: s2, brand: Firestone, model: Roadhawk 2, size: 205/55 R16 91V, season: summer, price: 3100, in_stock: true}
        - {id: s3, brand: Laufenn, model: S Fit EQ+, size: 205/55 R16 91V, season: summer, price: 2400, in_stock: true}
  turns:
    - user: літні 205/55 R16, бренд будь-який
    - user: а дешевше щось є?
      expect:
        must_not_contain: ['вашого бюджет', 'вашего бюджет', 'у ваш бюджет', 'в ваш бюджет', 'в межах бюджет']
        tool_not_called: [transfer_to_operator]

- id: tc_cheapest_claim_true_only
  title: «WinterHawk 4 ж найдоступніша?» — не підтверджувати хибне, назвати справжню
  source: tshina:bef4f5d66
  network: both
  sales_enabled: true
  notes: Tiguan R18 dialogue — the LLM called CrossWind (4 314 ₴) «самая доступная среди представленных» next to cards of 3 882 and 3 606 ₴. Here the client baits the same false claim
  mocks:
    search_tires:
      total: 3
      items:
        - {id: w1, brand: Firestone, model: WinterHawk 4, size: 235/55 R18 104H XL, season: winter, price: 4314, in_stock: true}
        - {id: w2, brand: Laufenn, model: I Fit+, size: 235/55 R18 104H XL, season: winter, price: 3882, in_stock: true}
        - {id: w3, brand: Kleber, model: Krisalp HP3, size: 235/55 R18 104H XL, season: winter, price: 3606, in_stock: true}
  turns:
    - user: зимові 235/55 R18 на Тігуан, без шипів, бренд будь-який
      expect:
        tool_called: [search_tires]
    - user: мені подобається WinterHawk 4 — вона ж найдоступніша з цих?
      expect:
        must_contain: ['Kleber|Клебер|3\s?606']
        must_not_contain:
          - '^\W*так\b'
          - '(?<!не )(?<!не є )(найдоступніш|найдешевш)\w*\s+(?:\w+\s+){0,3}(WinterHawk|Вінтерхок)'
          - '(WinterHawk|Вінтерхок)\W+(?:\w+\W+){0,4}(?<!не )(найдоступніш|найдешевш)'

