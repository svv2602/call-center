# Order and payment (owner decisions 2026-09-28): both networks take orders;
# an order is a REQUEST in 1C, a manager calls back to confirm. Payment terms
# are the same in both networks.
#
# Mocks follow the live handlers in `src/main.py`. Wave 2-D: under sales an
# order is ONE `submit_order_request` (the model stopped after
# `create_order_draft` in goldset №2/№3; the chain is hidden from it) —
# `request_created` + ORDER_REQUEST_CREATED_TEXT, or on a 1C + Store API
# failure `request_failed` + ORDER_REQUEST_FAILED_TEXT. Missing fields are
# asked for by the live handler; the mock answers the complete call.
# Payment terms come from the tenant row's `config.network_policy`
# (payment_methods, cod_fee_text, installment_banks) — it must be written for
# both networks, see network_terms.yaml.
# The sandbox has no caller id — the phone is spoken in words (a fake one;
# digits would trip the PII test on customer lines).

- id: order_two_tyres_price_per_piece
  title: 1–2 шини можна, ціна — за штуку
  source: tshina:quantity_two_ru
  network: both
  sales_enabled: true
  mocks:
    search_tires:
      total: 3
      items:
        - {id: t3, brand: Bridgestone, model: Turanza 6, size: 205/55 R16, season: summer, price: 3700, in_stock: true}
        - {id: t4, brand: Firestone, model: Roadhawk 2, size: 205/55 R16, season: summer, price: 3100, in_stock: true}
        - {id: t5, brand: Laufenn, model: S Fit EQ+, size: 205/55 R16, season: summer, price: 2400, in_stock: true}
  turns:
    - user: потрібно дві літні шини 205/55 R16
      expect:
        tool_called: [{name: search_tires, args: {width: '^205$', diameter: '^16$'}}]
        must_contain: ['за (одну |1 )?шину|за штуку|за одиницю|за шт']
        must_not_contain: ['(лише|тільки|только) комплект', 'мінімум (чотири|4)', 'минимум (четыре|4)']
        tool_not_called: [transfer_to_operator]

- id: order_finish_is_a_request
  title: оформлення — «заявку прийнято, менеджер зателефонує», не «підтверджено»
  source: owner:order-is-a-request
  network: both
  sales_enabled: true
  notes: the whole order script of _MOD_ORDER_FLOW_SALES, one step per turn (choice+quantity, phone, delivery, recipient, payment, confirmation) with a mock on every tool; one submit_order_request is expected on the last turn only, the old chain never
  mocks:
    search_tires:
      total: 2
      items:
        - {id: t3, brand: Bridgestone, model: Turanza 6, size: 205/55 R16, season: summer, price: 3700, in_stock: true}
        - {id: t4, brand: Firestone, model: Roadhawk 2, size: 205/55 R16, season: summer, price: 3100, in_stock: true}
    check_availability:
      product_id: t3
      available: true
      quantity: 12
    get_pickup_points:
      total: 1
      points:
        - {id: np1, address: 'Нова пошта, відділення №1', type: Нова пошта, city: Київ}
    submit_order_request:
      status: request_created
      payment_method: cod
      message: 'Заявку прийнято. Клієнту скажи: «Заявку прийнято, менеджер зателефонує для підтвердження.» Номер заявки не називай — його в результаті немає. Про замовлення як про готове не говори: остаточно його погодить менеджер.'
  turns:
    - user: потрібні дві літні шини 205/55 R16, бренд будь-який, без побажань
    - user: беру Bridgestone Turanza, дві штуки
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: телефон нуль дев'яносто дев'ять сто двадцять три сорок п'ять шістдесят сім
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: доставка Новою поштою в Київ, відділення номер один
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: отримувач Петренко Іван, телефон той самий
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: оплата при отриманні
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: так, усе правильно, оформлюйте
      expect:
        tool_called: [submit_order_request]
        tool_not_called: [create_order_draft, update_order_delivery, confirm_order]
        must_contain: ['заявк', 'менеджер\w*\s+(?:\w+\s+){0,2}(зателефону|передзвон|перезвон|звʼяж|зв''яж)']
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд', '\bAI-\d+', 'номер\w*\s+заявк\w*\s+\S*\d']

- id: order_1c_failure_hands_to_manager
  title: 1С не прийняла — «передам менеджеру, вам зателефонують», без «заявку прийнято»
  source: owner:order-is-a-request
  network: both
  sales_enabled: true
  notes: the whole order script of _MOD_ORDER_FLOW_SALES, one step per turn (choice+quantity, phone, delivery, recipient, payment, confirmation) with a mock on every tool; one submit_order_request is expected on the last turn only, the old chain never
  mocks:
    search_tires:
      total: 2
      items:
        - {id: t3, brand: Bridgestone, model: Turanza 6, size: 205/55 R16, season: summer, price: 3700, in_stock: true}
        - {id: t4, brand: Firestone, model: Roadhawk 2, size: 205/55 R16, season: summer, price: 3100, in_stock: true}
    check_availability:
      product_id: t3
      available: true
      quantity: 12
    get_pickup_points:
      total: 1
      points:
        - {id: np1, address: 'Нова пошта, відділення №1', type: Нова пошта, city: Київ}
    submit_order_request:
      error: true
      status: request_failed
      reason: request_failed
      message: 'Заявку створити не вдалося. Клієнту скажи: «Передам менеджеру, вам зателефонують.» Не обіцяй, що заявка вже є, і не називай жодного номера. Далі — transfer_to_operator або create_callback_request, якщо вони є серед твоїх інструментів.'
  turns:
    - user: потрібні дві літні шини 205/55 R16, бренд будь-який, без побажань
    - user: беру Bridgestone Turanza, дві штуки
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: телефон нуль дев'яносто дев'ять сто двадцять три сорок п'ять шістдесят сім
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: доставка Новою поштою в Київ, відділення номер один
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: отримувач Петренко Іван, телефон той самий
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: оплата карткою
      expect:
        must_not_contain: ['замовлення\s+(?:\w+\s+){0,2}підтверджен', 'заказ\s+(?:\w+\s+){0,2}подтвержд']
    - user: так, усе правильно, оформлюйте
      expect:
        tool_called: [submit_order_request]
        tool_not_called: [create_order_draft, update_order_delivery, confirm_order]
        must_contain: ['менеджер', 'зателефону|передзвон|перезвон']
        must_not_contain: ['заявку прийнят', 'заявка прийнят', 'заявку принят', 'заявк\w*\s+(?:\w+\s+){0,2}(створен|оформлен|создан)']

- id: order_think_no_reserve
  title: «я подумаю» — резерву немає
  source: owner:no-reserve
  network: both
  sales_enabled: true
  turns:
    - user: потрібні дві літні шини 205/55 R16
    - user: я ще подумаю, відкладіть їх для мене поки
      expect:
        must_not_contain: ['зарезерв', 'відклад\w*\s+(?:\w+\s+){0,2}для вас', 'забронюва', 'відкладу']

- id: payment_cod_commission
  title: накладений платіж — 2 % + 20 грн
  source: owner:payment-terms
  network: both
  sales_enabled: true
  notes: the fee is network_policy.cod_fee_text (owner — «2 % + 20 грн», may change); the case pins the owner value of 2026-09-28
  turns:
    - user: а можна оплатити при отриманні?
      expect:
        must_contain: ['наклад|при отриманн|післяплат', '2\s*%|два відсот', '20\s*(грн|гривень)|двадцять грив']
        max_sentences: 4

- id: payment_installments_ua
  title: оплата частинами — monobank і Приват
  source: tshina:installments_ua
  network: both
  sales_enabled: true
  turns:
    - user: чи можна купити шини в розстрочку?
      expect:
        must_contain: ['частинами|розстрочк', 'моно|monobank', 'приват']
        must_not_contain: ['миттєв', 'кредитн\w* догов']

- id: payment_card_and_prepay
  title: картка і передоплата — є в обох мережах
  source: owner:payment-terms
  network: both
  sales_enabled: true
  turns:
    - user: а карткою можна заплатити одразу?
      expect:
        must_contain: ['карт']
        must_not_contain: ['(лише|тільки) (готівк|при отриманн)']
        tool_not_called: [transfer_to_operator]
