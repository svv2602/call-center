# Cases from live operators' calls (Про Колесо + Твоя шина), 2025-10 … 2026-10.
# Collected 2026-10-27 from the local operator-call corpus: 290 inbound calls,
# transcribed on-prem (Whisper), personal data redacted, then labelled. The
# corpus itself is NOT in the repo (personal data); `source: operators:<batch>/
# <call>` points into it. Customer lines are the callers' own wording, lightly
# cleaned of transcription noise — Russian / surzhyk stays where the case is
# about understanding it. No names, phones or plates.
#
# What the corpus says about sales (batch1, ±5–10 pp): 74–78 % of sales calls
# ask for a SPECIFIC model or a site article, the operator offers 1.3 options
# on average, only ~10 % name a budget; 22–25 % ask how fresh the tyre is
# (operators name year/country in 55–61 %). The cases weight that mix:
# article / named model, year via check_availability, alternatives when the
# model is gone, delivery and payment terms, quantity, then consultation.
#
# Year, country and stock come with every search_tires item since 67539a3
# (`tire_stock.year_issue/country/stock_quantity`) and from check_availability
# for an article — the mocks follow the live shapes. The «Китай» filter itself
# runs in the search_tires handler, which the sandbox does not run: here the
# case checks the model reads the item's country.
#
# The sandbox plays the text path: the season guard and the spoken query
# parser do not run, so a line that should search names the season itself
# (the same as consult.yaml / tshina_chats.yaml).

# --- article from the site / a named model -----------------------------------

- id: op_article_price_and_stock
  title: клієнт називає артикул із сайту — перевірка наявності за артикулом
  source: operators:batch1/call_044
  network: both
  sales_enabled: true
  mocks:
    check_availability:
      available: true
      quantity: 8
      price: 2349
      country: Угорщина
      year: 2025
  turns:
    - user: доброго дня, мене цікавить товар по артикулу 52224, є в наявності?
      expect:
        tool_called: [{name: check_availability, args: {product_id: '52224'}}]
        must_contain: ['2\s?349|дві тисячі триста сорок дев']
        tool_not_called: [transfer_to_operator]

- id: op_article_year_from_stock
  title: «вона точно 25-го року?» за артикулом — рік із даних наявності
  source: operators:batch1/call_236
  network: both
  sales_enabled: true
  notes: 15 of 67 TS and 27 of 106 PK sales calls ask how fresh the tyre is; the year is in the check_availability result
  mocks:
    check_availability:
      available: true
      quantity: 4
      price: 2349
      country: Угорщина
      year: 2025
  turns:
    - user: артикул 52224, зимові
    - user: а вона точно двадцять п'ятого року?
      expect:
        must_contain: ['2025|двадцять п.ят|25']
        must_not_contain: ['2026|двадцять шост', '2024|двадцять четверт']
        tool_not_called: [transfer_to_operator]

- id: op_article_one_left_of_four
  title: за артикулом лишилась одна шина, а треба чотири — не обіцяти комплект
  source: operators:batch1/call_282
  network: both
  sales_enabled: true
  mocks:
    check_availability:
      available: true
      quantity: 1
      price: 7684
      country: Іспанія
      year: 2025
  turns:
    - user: артикул 41116, мені треба чотири штуки
      expect:
        tool_called: [check_availability]
        must_contain: ['одн[аіу]|1 шт|лише|тільки|только']
        must_not_contain: ['(є|есть|в наявності|в наличии)\s+(?:\w+\s+){0,2}(чотири|четыре|4)\s*(шин|штук|колес)']

- id: op_named_model_in_stock
  title: «є Блізак 6 205 на 55 R16?» — пошук за розміром, названа модель в відповіді
  source: operators:batch1/call_025
  network: both
  sales_enabled: true
  mocks:
    search_tires:
      total: 2
      items:
        - {id: b6, brand: Bridgestone, model: Blizzak 6, size: 205/55 R16 91H, season: winter, price: 4890, in_stock: true}
        - {id: f4, brand: Firestone, model: Winterhawk 4, size: 205/55 R16 91H, season: winter, price: 3390, in_stock: true}
  turns:
    - user: є в наявності Блізак 6, 205 на 55 R16, зимові?
      expect:
        tool_called: [{name: search_tires, args: {width: '^205$', profile: '^55$', diameter: '^16$'}}]
        must_contain: ['Blizzak|Бліз|Близ']
        tool_not_called: [transfer_to_operator]

- id: op_named_model_gone_alternatives
  title: «Кармаран Роад Перфоманс 205-60-16» немає — спершу «немає», потім альтернативи
  source: operators:batch1/call_064
  network: both
  sales_enabled: true
  notes: the brand is garbled the way callers and STT say it; Kormoran/Tigar/Taurus are one plant — operators offer the sister brand
  mocks:
    search_tires:
      total: 2
      relaxed: [brand]
      caveat_key: brand_unavailable_alternatives
      items:
        - {id: tg, brand: Tigar, model: High Performance, size: 205/60 R16 96V, season: summer, price: 2865, in_stock: true}
        - {id: ta, brand: Taurus, model: High Performance, size: 205/60 R16 96V, season: summer, price: 2810, in_stock: true}
  turns:
    - user: Кармаран Роад Перфоманс 205-60-16 летние, есть такой у вас?
      expect:
        tool_called: [{name: search_tires, args: {width: '^205$', profile: '^60$', diameter: '^16$'}}]
        must_contain: ['зараз немає в наявності|Цього бренду зараз немає', 'Tigar|Taurus|Тігар|Таурус']
        must_not_contain: ['Kormoran\s+(?:\w+\s+){0,3}(є в наявності|есть в наличии)']

