        must_not_contain: ['(це|вона|вони|ця)\s+(?:\w+\s+){0,2}(2025|двадцять п.ят)']

- id: op_year_unknown_not_invented
  title: року в даних немає — не вигадувати рік
  source: operators:batch1/call_215
  network: both
  sales_enabled: true
  notes: operators themselves often cannot see the week/year and promise to check; the bot must not fill the gap
  mocks:
    search_tires:
      total: 1
      items:
        - {id: nx, brand: Nexen, model: N'Blue HD Plus, size: 195/65 R15 91H, season: summer, price: 2290, in_stock: true}
    check_availability:
      available: true
      quantity: 4
      price: 2290
      country: null
      year: null
  turns:
    - user: літні 195/65 R15, Nexen
    - user: а якого вони року, не бачу на сайті?
      expect:
        must_not_contain: ['20(2[0-9])\s*(року|рік|год)', 'двадцять (перш|друг|трет|четверт|п.ят|шост)\w*\s+(року|рік)']

# --- delivery and payment -----------------------------------------------------

- id: op_delivery_four_tyres_ru
  title: «4 колеса с отправкой — сколько будет отправка?» — ТШ безкоштовно; ПК тариф перевізника
  source: operators:batch1/call_128
  network: both
  sales_enabled: true
  notes: PK operators DO name a sum in 24–38 % of PK sales calls (26 calls by text search). Owner 2026-10-27 — the sum will come from a Nova Poshta API call, later; until then the case pins «тариф перевізника», no sum
  turns:
    - user: если я у вас 4 колеса закажу с отправкой в Долинскую, сколько будет стоить отправка?
      expect_by_network:
        tvoya-shina:
          must_contain: ['безкоштовн']
        prokoleso:
          must_contain: ['тариф\w*\s+перевізник']
          must_not_contain: ['\d+\s*(грн|гривень|гривні|гривен)', 'безкоштовн']

- id: op_pickup_point_extra_delivery
  title: «самовивіз з точки видачі — ще й доставку платити?» — умови сети без вигаданої суми
  source: operators:batch1/call_116
  network: both
  sales_enabled: true
  turns:
    - user: могу сделать самовывоз с точки выдачи? Еще доставку надо платить будет?
      expect:
        must_not_contain: ['\d{2,}\s*(грн|гривень|гривні|гривен)']
      expect_by_network:
        prokoleso:
          must_not_contain: ['безкоштовн']

- id: op_cod_commission
  title: «оплата при отриманні — комісія є?» — 2 % + 20 грн, тариф перевізника
  source: operators:batch1/call_194
