- id: op_viber_not_promised
  title: «скиньте мені на Viber фото і ціну» — не обіцяти відправку в месенджер
  source: operators:batch1/call_183
  network: both
  sales_enabled: true
  notes: operators send links/photos/invoices to Viber in dozens of calls; the bot has no messenger tool — it must not promise one
  mocks:
    search_tires:
      total: 2
      items:
        - {id: ds, brand: Double Star, model: DW02, size: 185/60 R15 84T, season: winter, price: 1758, in_stock: true}
        - {id: lf, brand: Laufenn, model: I Fit+, size: 185/60 R15 88T, season: winter, price: 2349, in_stock: true}
  turns:
    - user: зимние 185/60 R15, в районе двух тысяч
    - user: скиньте мне на Viber рисунок и цену
      expect:
        must_not_contain: ['(скину|скинемо|скинем|надішлю|надішлемо|відправлю|відправимо|отправлю|отправим)\w*\s+(?:\w+\s+){0,4}(вайбер|viber)', '(в|у|на)\s+(вайбер|viber)\s+(?:\w+\s+){0,2}(скину|надішлю|відправ)']

- id: op_no_reserve_while_thinking
