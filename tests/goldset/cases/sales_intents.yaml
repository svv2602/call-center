# False exits under sales (tshina 9a2358962, consultant goldset wave V):
# a tyre-shop question the bot must answer on topic — not a
# transfer_to_operator, not «відповідаю тільки про…», not a made-up fact.
# In the voice bot the defect shows as a transfer or a refusal, so almost
# every turn carries `tool_not_called: [transfer_to_operator]`.
#
# Neighbours: the ua twins of delivery / warranty / installments /
# two-tyre order live in network_terms.yaml and orders.yaml; weather and
# injection with sales off live in scope_today.yaml. This file holds the
# sales_enabled=true side and the ru wording.
#
# Mocks follow the live result shapes:
# - search_tires — `StoreClient._search_tires_ladder` items {id, brand,
#   model, size, season, price, in_stock}, ranked and cut to 2–3;
# - get_vehicle_tire_sizes — `StoreClient.get_vehicle_tire_sizes`:
#   {found, brand, model, years, stock_sizes: ['215/60 R17'], selected_year};
# - get_order_status — `StoreClient.search_orders`: {found, orders:
#   [{id, order_number, status, status_label, items_summary, total,
#   estimated_delivery}]}.
#
# The spoken query parser (runflat refusal, dc9ebc0; commercial «бус») and
# the vehicle model normalizer (39c77a9, a DB lookup) do not run in the
# sandbox text path: those cases check what the model passes to the tool.

- id: sales_dot_year_ua
  title: дата виробництва / DOT — пояснити, не переводити
  source: tshina:dot_year_question_ua
  network: both
  sales_enabled: true
  turns:
    - user: а яка дата виробництва шин буде, як це дізнатися по DOT?
      expect:
        must_contain: ['DOT|ДОТ|рік випуску|тижд|цифр']
        must_not_contain: ['відповідаю тільки', 'отвечаю только']
        tool_not_called: [transfer_to_operator]
        max_sentences: 5

