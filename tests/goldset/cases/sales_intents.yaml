- id: sales_budget_per_tyre
  title: «бюджет до 3000 за шину» — пошук, не переведення
  source: tshina:budget_limit_ru
  network: both
  sales_enabled: true
  notes: search_tires has no price argument — the budget is the model's to hold; the mock is already within it and the case checks the search runs and no dearer tyre is invented
  mocks:
    search_tires:
      total: 2
      items:
        - {id: t4, brand: Firestone, model: Roadhawk 2, size: 205/55 R16, season: summer, price: 2900, in_stock: true}
        - {id: t5, brand: Laufenn, model: S Fit EQ+, size: 205/55 R16, season: summer, price: 2400, in_stock: true}
  turns:
    - user: літні 205/55 R16, бюджет до трьох тисяч за шину, бренд будь-який
      expect:
        tool_called: [{name: search_tires, args: {width: '^205$', profile: '^55$', diameter: '^16$'}}]
        must_contain: ['Firestone|Laufenn']
        must_not_contain: ['Bridgestone', 'Michelin', 'Continental']
        tool_not_called: [transfer_to_operator]

- id: sales_quantity_two_ru
  title: «нужно две шины» — продаём 1–2, цена за штуку
  source: tshina:quantity_two_ru
  network: both
  sales_enabled: true
  mocks:
    search_tires:
      total: 2
      items:
        - {id: w3, brand: Bridgestone, model: Blizzak LM005, size: 195/65 R15, season: winter, price: 3300, in_stock: true}
        - {id: w4, brand: Laufenn, model: I Fit+, size: 195/65 R15, season: winter, price: 2200, in_stock: true}
  turns:
    - user: нужно две зимние шины 195/65 R15, без шипов, бренд любой
      expect:
        tool_called: [{name: search_tires, args: {width: '^195$', profile: '^65$', diameter: '^15$'}}]
        must_contain: ['за (одну |1 )?шину|за штуку|за шт|за одиницю|за единицу']
        must_not_contain: ['(лише|тільки|только) комплект', 'мінімум (чотири|4)', 'минимум (четыре|4)']
        tool_not_called: [transfer_to_operator]

