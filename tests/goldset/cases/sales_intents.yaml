- id: sales_no_runflat_search
  title: «без ранфлета» — пошук без RunFlat-вимоги (dc9ebc0)
  source: tshina:runflat_persists_cheaper_ru
  network: both
  sales_enabled: true
  notes: the refusal parser (parse_tech_refusals, dc9ebc0) runs only in the voice pipeline; here the model passes the args. The schema cannot say «runflat absent or false» (an absent arg fails an args regex), so the case pins the search and that no RunFlat tyre is offered as a requirement
  mocks:
    search_tires:
      total: 2
      items:
        - {id: r1, brand: Bridgestone, model: Potenza Sport, size: 225/45 R17, season: summer, price: 4600, in_stock: true}
        - {id: r2, brand: Firestone, model: Roadhawk 2, size: 225/45 R17, season: summer, price: 3500, in_stock: true}
  turns:
    - user: без ранфлета, 225/45 R17 літні, бренд будь-який
      expect:
        tool_called: [{name: search_tires, args: {width: '^225$', profile: '^45$', diameter: '^17$'}}]
        must_not_contain: ['(потрібн|нужн)\w*\s+(?:\w+\s+){0,2}(ран\s*флет|runflat|run flat)', '(підібрав|подобрал|знайшов|нашел)\s+(?:\w+\s+){0,3}(ран\s*флет|runflat)']
        tool_not_called: [transfer_to_operator]

- id: sales_vehicle_mercedes_gla
  title: «шини на Мерседес ГЛА 2019» — розміри по авто з моделлю (39c77a9)
  source: owner:vehicle-model-letters
  network: both
  sales_enabled: true
  notes: the model normalizer (39c77a9) is a DB lookup behind get_vehicle_tire_sizes; the sandbox mocks it, so the case checks the model name reaches the tool and the factory sizes reach the reply
  mocks:
    get_vehicle_tire_sizes:
      found: true
      brand: Mercedes-Benz
      model: GLA-Class
      years: [2020, 2019, 2018]
      stock_sizes: ['215/60 R17', '235/50 R18']
      selected_year: 2019
  turns:
    - user: потрібні літні шини на Мерседес ГЛА двадцять дев'ятнадцятого року
      expect:
        # since 04122b2 the code looks the car up itself: the caller's words
        # reach the tool as vehicle_text, the catalogue reads the model
        tool_called: [{name: get_vehicle_tire_sizes, args: {vehicle_text: 'мерс.*(?:гла|gla)'}}]
        must_contain: ['215/60|двісті п.ятнадцять|235/50|двісті тридцять п.ять']
        tool_not_called: [transfer_to_operator]

- id: sales_vehicle_glc_spelled
  title: «на джі ел сі» — модель літерами, розміри по авто (39c77a9)
  source: owner:vehicle-model-letters
  network: both
  sales_enabled: true
  notes: spelled letters — the model may pass «GLC» or the words as heard; both are fine, the normalizer resolves either on the live path
  mocks:
    get_vehicle_tire_sizes:
      found: true
      brand: Mercedes-Benz
      model: GLC-Class
      years: [2021, 2020, 2019]
      stock_sizes: ['235/60 R18', '235/55 R19']
      selected_year: 2020
  turns:
    - user: зимові шини на Мерседес джі ел сі двадцятого року
      expect:
        # since 04122b2 the code looks the car up itself (vehicle_text)
        tool_called: [{name: get_vehicle_tire_sizes, args: {vehicle_text: 'мерс.*(?:джі|джи|glc|глц)'}}]
        must_contain: ['235/60|235/55|двісті тридцять п.ять']
        tool_not_called: [transfer_to_operator]

- id: sales_van_tyres_search
  title: «шини на бус 215/65 R16» — пошук шин, не переведення
  source: owner:commercial-tyres
  network: both
  sales_enabled: true
  notes: search_tires has no commercial/vehicle_type argument yet (the parser reads «бус»/«газель» as commercial only in the voice path, dc9ebc0) — the case expects the search itself; add a commercial args check once the schema has it
  mocks:
    search_tires:
      total: 2
      items:
        - {id: c1, brand: Bridgestone, model: Duravis R660, size: 215/65 R16C, season: summer, price: 4300, in_stock: true}
        - {id: c2, brand: Firestone, model: Vanhawk 2, size: 215/65 R16C, season: summer, price: 3600, in_stock: true}
  turns:
    - user: потрібні літні шини на бус 215/65 R16, бренд будь-який
      expect:
        tool_called: [{name: search_tires, args: {width: '^215$', profile: '^65$', diameter: '^16$'}}]
        must_not_contain: ['не продаєм', 'не продаем', 'тільки легков', 'только легков']
        tool_not_called: [transfer_to_operator]
